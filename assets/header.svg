<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Mert Aslan, DryMertini. Full-stack developer, AI agents and pipelines.">
  <defs>
    <linearGradient id="comet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2b33d" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffd98a"/>
    </linearGradient>
    <clipPath id="lanes"><rect x="730" y="80" width="370" height="240"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="398" rx="18" fill="#0a0c10" stroke="#262b33" stroke-width="2"/>

  <!-- handle -->
  <g transform="translate(64 50)" fill="none" stroke="#f2b33d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 0H26L13 15Z"/>
    <path d="M13 15V28M5 28H21"/>
    <path d="M22 -6L15 6" stroke="#9da7b3"/>
    <circle cx="16" cy="5" r="2.6" fill="#3fb950" stroke="none"/>
  </g>
  <text x="104" y="72" class="mono" font-size="18" fill="#f2b33d">DryMertini</text>

  <!-- name -->
  <text x="58" y="178" class="sans" font-size="108" font-weight="900" letter-spacing="-3" fill="#f0f6fc">MERT</text>
  <text x="58" y="276" class="sans" font-size="108" font-weight="900" letter-spacing="-3" fill="none" stroke="#f2b33d" stroke-width="2.5">ASLAN</text>
  <text x="64" y="322" class="sans" font-size="23" fill="#9da7b3">Full-stack developer · AI agents &amp; pipelines</text>

  <!-- parallel lanes -->
  <g class="mono" font-size="14" fill="#9da7b3">
    <text x="600" y="113">orchestration</text>
    <text x="600" y="161">agents</text>
    <text x="600" y="209">pipelines</text>
    <text x="600" y="257">automation</text>
    <text x="600" y="305">web3</text>
  </g>
  <g stroke="#1c2129" stroke-width="2">
    <path d="M730 108H1100M730 156H1100M730 204H1100M730 252H1100M730 300H1100"/>
  </g>

  <g clip-path="url(#lanes)">
    <rect y="106" width="110" height="4" rx="2" fill="url(#comet)">
      <animate attributeName="x" values="620;1100;1100" keyTimes="0;0.55;1" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect y="154" width="110" height="4" rx="2" fill="url(#comet)">
      <animate attributeName="x" values="620;1100;1100" keyTimes="0;0.5;1" dur="1.7s" begin="-0.6s" repeatCount="indefinite"/>
    </rect>
    <rect y="202" width="140" height="4" rx="2" fill="url(#comet)">
      <animate attributeName="x" values="590;1100;1100" keyTimes="0;0.6;1" dur="0.9s" begin="-0.2s" repeatCount="indefinite"/>
    </rect>
    <rect y="250" width="140" height="4" rx="2" fill="url(#comet)">
      <animate attributeName="x" values="590;1100;1100" keyTimes="0;0.6;1" dur="1.1s" begin="-0.7s" repeatCount="indefinite"/>
    </rect>
    <rect y="298" width="110" height="4" rx="2" fill="url(#comet)">
      <animate attributeName="x" values="620;1100;1100" keyTimes="0;0.5;1" dur="1.9s" begin="-1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1116 108l5 5 9-10" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.3;1;0.3" keyTimes="0;0.5;0.56;1" dur="1.3s" repeatCount="indefinite"/>
    </path>
    <path d="M1116 156l5 5 9-10" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.3;1;0.3" keyTimes="0;0.45;0.51;1" dur="1.7s" begin="-0.6s" repeatCount="indefinite"/>
    </path>
    <path d="M1116 204l5 5 9-10" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.3;1;0.3" keyTimes="0;0.55;0.61;1" dur="0.9s" begin="-0.2s" repeatCount="indefinite"/>
    </path>
    <path d="M1116 252l5 5 9-10" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.3;1;0.3" keyTimes="0;0.55;0.61;1" dur="1.1s" begin="-0.7s" repeatCount="indefinite"/>
    </path>
    <path d="M1116 300l5 5 9-10" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.3;1;0.3" keyTimes="0;0.45;0.51;1" dur="1.9s" begin="-1.1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- stack -->
  <text x="64" y="368" class="mono" font-size="15" fill="#6e7681">Python · C · TypeScript · JavaScript · SQL · React · Next.js · Solana</text>
</svg>
